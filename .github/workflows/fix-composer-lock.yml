name: Fix Composer Lock

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.head_repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Regenerate composer.lock
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Commit updated lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Fix Composer lock dependencies"
          git push origin HEAD:${{ github.head_ref }}
